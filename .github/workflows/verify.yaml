name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ci:ephemeral_ci_password@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --test postgres --locked -- --ignored
      - run: cargo test --doc --locked
      - run: cargo build --locked
      - run: python3 -m unittest discover -s scripts/client -p test_prepare_lab_client.py -v
      - run: docker build -t vindictus-server:ci .
