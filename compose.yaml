name: vindictus-server

x-app: &app
  image: vindictus-server:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-environment
    DATABASE_URL: postgres://${APP_DATABASE_USER:-vindictus_app}:${APP_DATABASE_PASSWORD:?Generate a local .env first}@postgres:5432/${POSTGRES_DB:-vindictus}
    RUST_LOG: ${RUST_LOG:-info}
  networks: [backend]
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    # Crash recovery syncs the data directory with one syncfs instead of an fsync per file:
    # the restored legacy data has too many files for the per-file pass (over 30 minutes).
    command: [postgres, -c, recovery_init_sync_method=syncfs]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local .env first}
      POSTGRES_DB: ${POSTGRES_DB:-vindictus}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-vindictus_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Generate a local .env first}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/database/init-postgres.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *app
    command: [serve]
    environment:
      <<: *app-environment
      BIND_ADDRESS: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${HTTP_HOST_PORT:-8080}:8080
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Game laboratory: frontend 27015, city channel 27003 and mission relay 27005, published
  # only on the host loopback. Private content and the protected runtime profile stay on the
  # host (.cache) and are mounted read-only; nothing private enters the image.
  game:
    <<: *app
    entrypoint: [/bin/sh, -c]
    command:
      - exec /app/vindictus-server lab-frontend --input-stdin --container-listen
        --policy-file /content/reward-policy.json
        --name-proof-file /content/character-name-proof.json
        --minimum-creation-assets /lab/minimum-creation-assets.json
        < /run/secrets/lab_runtime_profile
    environment:
      <<: *app-environment
      DB_MAX_CONNECTIONS: "8"
    volumes:
      - ./.cache/private-content:/content:ro
      - ./docker/lab/minimum-creation-assets.json:/lab/minimum-creation-assets.json:ro
    secrets: [lab_runtime_profile]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:27015:27015
      - 127.0.0.1:27003:27003
      - 127.0.0.1:27005:27005
    healthcheck:
      # Port 27015 (0x6987) in LISTEN state; connecting would open a login session.
      test: [CMD-SHELL, "grep -qi ':6987 00000000:0000 0A' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 30s
    restart: unless-stopped

  # Client server list: the prepared client reads EndPoint.txt from 127.0.0.1:8081.
  bootstrap:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: [httpd, -f, -p, "8081", -h, /www]
    user: "65534:65534"
    volumes:
      - ./.cache/client-bootstrap:/www:ro
    ports:
      - 127.0.0.1:8081:8081
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/en-eu-x-gm/EndPoint.txt]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  legacy-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [legacy]
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:-Y}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      - 127.0.0.1:${MSSQL_HOST_PORT:-14333}:1433
    volumes:
      - legacy-sqlserver-data:/var/opt/mssql
      - ../ServidorVindictus/database:/backups:ro
      - ./scripts/database:/migration-scripts:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  legacy-sqlserver-data:

networks:
  backend:

secrets:
  lab_runtime_profile:
    file: ${LAB_RUNTIME_PROFILE:-./.cache/private-frontend/runtime-profile.json}

