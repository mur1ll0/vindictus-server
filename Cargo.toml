[package]
name = "vindictus-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Preservation research foundation; legacy game protocol migration remains incomplete"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.6"
clap = { version = "4.5.48", features = ["derive"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = { version = "1.11", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
rsa = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tower-http = { version = "0.6.6", features = ["trace", "timeout", "fs", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = "5.4.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
