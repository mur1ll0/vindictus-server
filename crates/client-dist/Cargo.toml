[package]
name = "vindictus-client-dist"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Client distribution of the launcher: signed manifests, path rules, hfs-xor and adaptive zstd objects"

[dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
zstd = { version = "0.13.3", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
