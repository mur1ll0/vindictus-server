[package]
name = "vindictus-launcher"
version = "0.1.0"
edition = "2024"
description = "Launcher do Vindictus (trilha L): login com senha, Jogar direto para a seleção de personagem, painel e cadastro"
publish = false

# Fora do pacote da raiz: só compila para Windows e não entra no build do Docker (o .dockerignore
# é uma lista de permissões) nem no `cargo test` do servidor. Compilar com `build.ps1` nesta pasta
# (alvo win7; ver lá).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["serde"] }
# HTTP com rustls e raízes embutidas: não depende do SChannel nem do repositório de certificados do
# Windows 7, que costumam estar desatualizados.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# Win32 puro (sem WebView2): roda do Windows 7 ao 11. A 0.52 importa cada função da DLL onde ela
# existe desde o Windows 7 (user32/gdi32/comctl32/shell32/ole32), sem combase nem WinRT; é a mesma
# escolha do pw-launcher (B275 do pw-universal, conferida num Windows 7 real).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "unwind"
